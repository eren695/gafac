<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation - GAFAC CD</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e3e3e3;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            background-color: #111111;
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .document-container {
            margin-top: 70px;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }
        .document-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        gafac.cd
    </div>

    <div class="document-container">
        <img src="pppp.png" alt="Bordereau">
    </div>

</body>
</html>
